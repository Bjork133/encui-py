[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "encui-py"
version = "0.1.0"
description = "Cross-platform Textual TUI combining encui and conway-aes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80.0",
    "cryptography>=42.0.0",
]

[project.scripts]
encui = "encui_py.app:run"